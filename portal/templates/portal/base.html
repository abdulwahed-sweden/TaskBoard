<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Service portal{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
           background: #f4f5f7; color: #1f2933; line-height: 1.5; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px;
            margin-top: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[type=text], input[type=password], input[type=tel],
    input[type=date], select, textarea {
      width: 100%; padding: 12px; font-size: 1rem;
      border: 1px solid #cbd2d9; border-radius: 8px; }
    button { width: 100%; min-height: 48px; padding: 14px; margin-top: 18px;
             font-size: 1rem; font-weight: 600; color: #fff;
             background: #2557d6; border: none; border-radius: 8px; }
    ul.errorlist { color: #b91c1c; list-style: none; padding: 0; margin: 6px 0; }
    .errors { color: #b91c1c; }
    .muted { color: #616e7c; font-size: .9rem; }
    dl dt { font-weight: 600; } dl dd { margin: 0 0 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
